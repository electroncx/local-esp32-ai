name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      QEMU_URL: https://github.com/espressif/qemu/releases/download/esp-develop-9.0.0-20240606/qemu-xtensa-softmmu-esp_develop_9.0.0_20240606-x86_64-linux-gnu.tar.xz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO and Espressif's ESP32 emulator
        run: |
          pip install platformio
          sudo apt-get update
          sudo apt-get install -y libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0
          curl -sSL "$QEMU_URL" | tar -xJ -C "$RUNNER_TEMP"
      # engine build, routing, every trained phrasing, the test questions,
      # all four firmware targets, and the ESP32 firmware in the emulator
      - run: ./test.sh --qemu "$RUNNER_TEMP/qemu/bin/qemu-system-xtensa"
