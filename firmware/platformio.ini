; Flash:   pio run -t upload               (classic ESP32, 4 MB flash)
;          pio run -e esp32-s3 -t upload   (or esp32-c3; esp32dev-dio if QIO won't boot)
; Chat:    pio device monitor
[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
; the model file is embedded in flash as-is (see embed_model.py)
extra_scripts = pre:embed_model.py
custom_model = data/model.bin
; the 2M model (~3 MB) needs one 3.9 MB app partition on a 4 MB flash
board_build.partitions = partitions.csv
build_unflags = -Os
build_flags = -O2

[env:esp32dev]
board = esp32dev
; Answers stream the weights from flash, so flash speed is answer speed.
; PlatformIO's esp32dev default is 40 MHz DIO; the Arduino IDE's "ESP32 Dev
; Module" default (and what ESP32-WROOM/WROVER modules support) is 80 MHz QIO:
; about 4x the read bandwidth. If a board won't boot, change these back.
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Same at 80 MHz DIO: for a board that won't boot in QIO mode, and for the
; ESP32 emulator (QEMU), which can't switch its flash to QIO.
[env:esp32dev-dio]
board = esp32dev
board_build.f_flash = 80000000L
board_build.flash_mode = dio

; The DevKitC-1 definition assumes 8 MB; 4 MB runs on any ESP32-S3 board.
[env:esp32-s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB

[env:esp32-c3]
board = esp32-c3-devkitm-1
